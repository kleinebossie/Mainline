name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Mirror the dev machine exactly via .nvmrc (Node 25.2.0 → npm 11.6.2).
          # npm 10 vs 11 prune the optional @emnapi/* (unrs-resolver WASM) sub-tree
          # differently, which breaks `npm ci`; pinning the version keeps the lockfile
          # compatible. Move to an LTS later by bumping .nvmrc + regenerating the lock.
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma generate
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm run test:unit

      - name: Guard Tests
        run: npm run test:guards

      - name: Build Next.js App
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run e2e tests
        run: npm run test:e2e
