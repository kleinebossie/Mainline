name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-playwright-auth-secret-not-for-production
      PLAYWRIGHT_DATABASE_URL: postgresql://mainline:mainline_e2e@127.0.0.1:5432/mainline_e2e?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mainline
          POSTGRES_PASSWORD: mainline_e2e
          POSTGRES_DB: mainline_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mainline -d mainline_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Mirror the dev machine exactly via .nvmrc (Node 25.2.0 → npm 11.6.2).
          # npm 10 vs 11 prune the optional @emnapi/* (unrs-resolver WASM) sub-tree
          # differently, which breaks `npm ci`; pinning the version keeps the lockfile
          # compatible. Move to an LTS later by bumping .nvmrc + regenerating the lock.
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma generate
        run: npm run prisma:generate

      - name: Migrate disposable Playwright database
        run: npm run prisma:deploy
        env:
          DATABASE_URL: ${{ env.PLAYWRIGHT_DATABASE_URL }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm run test:unit

      - name: Guard Tests
        run: npm run test:guards

      - name: Build Next.js App
        run: npm run build
        env:
          DATABASE_URL: ${{ env.PLAYWRIGHT_DATABASE_URL }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run e2e tests
        run: npm run test:e2e
